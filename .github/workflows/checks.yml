# Runs on every push and pull request: secret scan, script checks, config checks.
# Third-party code is pinned: actions by commit SHA, gitleaks by version + published checksum.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history, so the secret scan covers every commit

      - name: Secret scan (gitleaks, whole history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks git . --no-banner --redact

      - name: Shell scripts (syntax + ShellCheck)
        run: |
          files=$(git ls-files '*.sh' .githooks/pre-commit)
          for f in $files; do bash -n "$f"; done
          shellcheck -S warning $files

      - name: PowerShell scripts (parse)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (git ls-files '*.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { "::error file=$f::$($_.Message)" }; $bad++ }
          }
          if ($bad) { exit 1 }

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Python lint (ruff, versions from uv.lock)
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Python tests (pytest)
        run: uv run --locked pytest -q

      - name: JSON configs (valid)
        run: |
          for f in $(git ls-files '*.json'); do python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }; done

      - name: Personal-details scan (private repo only)
        if: hashFiles('publish/publish.py') != ''
        run: python3 -I publish/publish.py --check
